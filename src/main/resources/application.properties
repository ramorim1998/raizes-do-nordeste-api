spring.application.name=raizes-api
spring.config.import=optional:file:./.env[.properties]

# Conexao com PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/raizes_db}
spring.datasource.username=${DB_USERNAME:raizes_app}
spring.datasource.password=${DB_PASSWORD}

# Persistencia
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Migrations
spring.flyway.enabled=true

# A autenticacao usa as contas da aplicacao e tokens JWT.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Quantidades inteiras e canais nomeados no JSON.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
